<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="waxGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#b91c1c"/>
      <stop offset="85%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Irregular organic wax outer edge -->
  <path d="M60,6 C75,5 88,10 98,20 C110,32 115,48 114,63 C113,80 106,94 93,105 C79,116 61,115 45,113 C29,111 16,102 9,88 C1,73 3,57 9,42 C16,25 32,8 60,6 Z" 
        fill="url(#waxGrad)" filter="url(#waxShadow)"/>
  <!-- Inner impressed ring -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#7f1d1d" stroke-width="2.5" opacity="0.6"/>
  <circle cx="60" cy="60" r="41" fill="none" stroke="url(#goldRim)" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <!-- Central Song Hỷ (囍) Symbol embossed in gold -->
  <g fill="url(#goldRim)" filter="drop-shadow(1px 1px 1px rgba(0,0,0,0.5))" transform="translate(30, 28) scale(0.5)">
    <!-- Traditional Double Happiness 囍 Calligraphic Path -->
    <path d="M12,10 h38 v14 h-38 z M68,10 h38 v14 h-38 z M8,34 h102 v12 h-102 z M24,46 h14 v20 h-14 z M80,46 h14 v20 h-14 z M6,72 h106 v12 h-106 z M16,84 h28 v28 h-28 z M22,90 h16 v16 h-16 z M74,84 h28 v28 h-28 z M80,90 h16 v16 h-16 z"/>
  </g>
</svg>
